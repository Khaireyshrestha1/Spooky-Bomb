<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4x4 Bomb Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            font-family: 'Creepster', cursive;
            color: #fff;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 3rem;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 60px);
            gap: 10px;
        }

        .cell {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #444;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .cell:hover {
            background-color: #666;
            transform: scale(1.1);
        }

        .cell.disabled {
            cursor: not-allowed;
            pointer-events: none;
            background-color: #9e9e9e;
        }

        .message {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
        }

        .restart, .hint {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #e53935;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .restart:hover, .hint:hover {
            background-color: #740b0b;
            transform: scale(1.1);
        }

        .restart:active, .hint:active {
            transform: scale(1);
        }

        @import url('https://fonts.googleapis.com/css2?family=Creepster&display=swap');
    </style>
</head>
<body>
    <h1>Spooky Bomb Game</h1>
    <div class="grid" id="grid"></div>
    <div class="message" id="message"></div>
    <button class="restart" id="restart">Restart</button>
    <button class="hint" id="hint">Get Hint</button>

    <script>
        const grid = document.getElementById('grid');
        const message = document.getElementById('message');
        const restartButton = document.getElementById('restart');
        const hintButton = document.getElementById('hint');
        const bombCount = 8;
        const gridSize = 16;
        let bombPositions;
        let safeCellsLeft;

        function generateMathProblem() {
            const a = Math.floor(Math.random() * 10) + 1;
            const b = Math.floor(Math.random() * 10) + 1;
            const result = a * b;
            return { problem: `${a} x ${b}`, answer: result };
        }

        function initializeGame() {
            grid.innerHTML = '';
            message.textContent = '';
            bombPositions = new Set();
            safeCellsLeft = gridSize - bombCount;

            while (bombPositions.size < bombCount) {
                const randomPosition = Math.floor(Math.random() * gridSize);
                bombPositions.add(randomPosition);
            }

            for (let i = 0; i < gridSize; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;

                cell.addEventListener('click', () => {
                    if (bombPositions.has(i)) {
                        cell.textContent = '💣';
                        cell.style.backgroundColor = '#e53935';
                        message.textContent = 'You Lose!';
                        message.style.color = '#e53935';
                        disableAllCells();
                    } else {
                        cell.textContent = '✔';
                        cell.classList.add('disabled');
                        safeCellsLeft--;

                        if (safeCellsLeft === 0) {
                            message.textContent = 'You Win!';
                            message.style.color = '#4caf50';
                            disableAllCells();
                        }
                    }
                });

                grid.appendChild(cell);
            }
        }

        function disableAllCells() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.classList.add('disabled');
                cell.style.pointerEvents = 'none';
            });
        }

        hintButton.addEventListener('click', () => {
            const mathProblem = generateMathProblem();
            const userAnswer = prompt(`Solve this problem to get a hint: ${mathProblem.problem}`);

            if (parseInt(userAnswer) === mathProblem.answer) {
                const bombArray = Array.from(bombPositions);
                const hintIndex = bombArray[Math.floor(Math.random() * bombArray.length)];
                const hintCell = document.querySelector(`.cell[data-index="${hintIndex}"]`);
                hintCell.style.backgroundColor = '#ffeb3b';
                hintCell.textContent = '💣?';
                message.textContent = 'Hint revealed!';
                message.style.color = '#ffeb3b';
            } else {
                message.textContent = 'Wrong answer! motherfucker restart the game muji.';
                message.style.color = '#e53935';
            }
        });

        restartButton.addEventListener('click', initializeGame);

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                initializeGame();
            }
        });

        initializeGame();
    </script>
</body>
</html>
